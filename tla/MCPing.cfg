\* Ping/pong keep-alive machinery on a two-replica model.
\* Expected: no violations.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2
    GenBudget     = 2
    PingBudget    = 1
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    EnablePing    = TRUE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    BvvExact
    BvvCovers
    SyncPointPerSrc
    QuiescentConverged
