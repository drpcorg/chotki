\* Intended fixed cho.last allocator: the same local own-source drain witness
\* is enabled, but cho.last is synchronized before the next CommitPacket
\* reads it.  Expected: no violations.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2Last
    GenBudget     = 0
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = TRUE
    EnablePing    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    FreshLocalIds
    BvvExact
    BvvCovers
