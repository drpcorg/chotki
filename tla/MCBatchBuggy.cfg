\* The pre-fix batched drain: a mid-batch error drops the staged Y/C/O/E records
\* (their version-vector bumps dropped with them) yet cho.last was already
\* advanced to their own-source ids. cho.last is left ahead of the persisted VV;
\* a restart rebuilds it from the VV (behind) and the next commit reissues an id
\* a peer already holds. Same allocator model as MCBuggyLast, batched + buggy.
\* Expected: LastNotAhead VIOLATED (a tiny trace: one dropped own-source drain
\* advances last to 1 while the persisted VV stays 0).
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2Last
    GenBudget     = 0
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = TRUE
    EnablePing    = FALSE
    BatchMode     = TRUE
    BatchBuggy    = TRUE
INVARIANTS
    TypeOK
    LastCoversOwnVV
    LastNotAhead
    FreshLocalIds
