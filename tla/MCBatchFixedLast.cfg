\* The fixed batched drain, allocator focus: same own-source drain witness as
\* MCFixedLast, but with the batched all-or-nothing apply (BatchMode) and the
\* fix (BatchBuggy FALSE) — the applied prefix is flushed even on error and
\* cho.last advances only after that durable write. cho.last must move in
\* lock-step with the persisted VV. (QuiescentConverged is not checked: the
\* own-source drain injects data it never broadcasts, so it cannot converge —
\* same as MCFixedLast.)
\* Expected: no violations (LastNotAhead, LastCoversOwnVV, FreshLocalIds hold).
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2Last
    GenBudget     = 0
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = TRUE
    EnablePing    = FALSE
    BatchMode     = TRUE
    BatchBuggy    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    LastNotAhead
    FreshLocalIds
    BvvExact
    BvvCovers
