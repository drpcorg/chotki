\* The fixed batched drain, allocator focus: same own-source drain witness as
\* MCFixedLast, but with the batched all-or-nothing apply (BatchMode) and the
\* fix (BatchBuggy FALSE) — drop-on-error: an erroring batch persists nothing
\* and consumes no id, so cho.last must move in lock-step with the persisted
\* VV. NOTE: in BatchMode the own-source drain models only the DROPPED batch
\* (OwnSourceDrain hardcodes dropped == BatchMode), so the successful batched
\* own-source drain path is not explored here. (QuiescentConverged is not
\* checked: the own-source drain injects data it never broadcasts, so it
\* cannot converge — same as MCFixedLast.)
\* Expected: no violations (LastNotAhead, LastCoversOwnVV, FreshLocalIds hold).
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2Last
    GenBudget     = 0
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = TRUE
    EnablePing    = FALSE
    BatchMode     = TRUE
    BatchBuggy    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    LastNotAhead
    FreshLocalIds
    BvvExact
    BvvCovers
