\* Main safety configuration: fixed protocol, three replicas in a chain,
\* the two end replicas commit one op each (relay in both directions
\* through "b").  Session churn is covered separately by MCFixedChurn.cfg.
\* Expected: no violations.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetAC
    GenBudget     = 1
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = FALSE
    EnablePing    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    FreshLocalIds
    BvvExact
    BvvCovers
    SyncPointPerSrc
    QuiescentConverged
