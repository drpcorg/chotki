\* The fixed batched drain: chotki.go drain() applies the Y/C/O/E records as one
\* all-or-nothing pebble batch (BatchMode) with drop-on-error semantics — on a
\* mid-batch error nothing is applied or relayed and cho.last does not advance;
\* on success cho.last advances only after the durable write. Same
\* three-replica chain as MCFixed, exercising the batched live/diff relay end to
\* end (the local id allocator under batching is covered by MCBatchFixedLast).
\* Expected: no violations (NoGaps, QuiescentConverged, LastNotAhead, ... hold).
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetAC
    GenBudget     = 1
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = FALSE
    EnablePing    = FALSE
    BatchMode     = TRUE
    BatchBuggy    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    LastNotAhead
    FreshLocalIds
    BvvExact
    BvvCovers
    SyncPointPerSrc
    QuiescentConverged
