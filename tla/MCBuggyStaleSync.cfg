\* Demonstrates the session-scoping bug found BY this model (fixed in this
\* commit by Syncer.SessionId / Chotki.AbortSyncsVia): a sync point
\* (pending diff batch) used to outlive the session whose 'H' created it.
\* A relayed 'H' creates a sync point downstream; the relayed 'D' records
\* die in the queue/channel of a reconnecting downstream link; the middle
\* replica then relays the 'V' into the NEW connection, and the downstream
\* replica applies the staged handshake VV without the data records —
\* its version vector claims ops it never stored, so nobody ever re-sends
\* them: permanent, silent data loss.
\* Expected: NoGaps VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA3
    GenBudget     = 2
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = FALSE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = FALSE
    EnablePing    = FALSE
    BatchMode     = FALSE
    BatchBuggy    = FALSE
INVARIANTS
    NoGaps
