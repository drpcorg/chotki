\* Demonstrates the broadcast-relay bug of replication/sync.go Drain()
\* (fixed in this commit): a coalesced batch ending with 'B' (bye) was not
\* rebroadcast at all, so records applied at the middle replica never
\* reached downstream replicas; the subsequent re-handshake then merges the
\* origin's version vector downstream WITHOUT the data (relayed 'H' + empty
\* diff), permanently poisoning the downstream VV.
\* Expected: NoGaps (and QuiescentConverged) VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA3
    GenBudget     = 2
    PingBudget    = 0
    BuggyRelay    = TRUE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    EnablePing    = FALSE
INVARIANTS
    NoGaps
    QuiescentConverged
