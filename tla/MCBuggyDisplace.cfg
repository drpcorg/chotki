\* Demonstrates the sync-point displacement bug of chotki.go drain() 'H'
\* (fixed in this commit): the "allow only 1 diff sync per src" cleanup
\* compared sync-point keys against cho.src (the local replica) instead of
\* the incoming handshake's source, so it never displaced anything and a
\* replica could accumulate several pending diff batches for one origin.
\* Expected: SyncPointPerSrc VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA3
    GenBudget     = 2
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = FALSE
    DropSyncsOnClose = TRUE
    EnablePing    = FALSE
INVARIANTS
    SyncPointPerSrc
