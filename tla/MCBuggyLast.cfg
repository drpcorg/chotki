\* Demonstrates the cho.last allocator race: an own-source record can be
\* drained without a synchronized update to the cached local allocator state.
\* The next CommitPacket then stamps a fresh local mutation with the same
\* seq.  Expected: FreshLocalIds VIOLATED.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas2
    Edges         <- MCEdges2
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA2Last
    GenBudget     = 0
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = FALSE
    EnableOwnSourceDrain = TRUE
    EnablePing    = FALSE
    BatchMode     = FALSE
    BatchBuggy    = FALSE
INVARIANTS
    TypeOK
    FreshLocalIds
