\* Session churn: one committer, graceful closes, coalesced byes,
\* reconnects, re-handshakes over stale sync points.  This is the same
\* state space in which MCBuggyRelay.cfg / MCBuggyDisplace.cfg find their
\* violations, explored with the fixed protocol.
\* Expected: no violations.
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetA3
    GenBudget     = 2
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = FALSE
    EnablePing    = FALSE
    BatchMode     = FALSE
    BatchBuggy    = FALSE
INVARIANTS
    TypeOK
    NoGaps
    VVBounded
    LastCoversOwnVV
    LastNotAhead
    FreshLocalIds
    BvvExact
    BvvCovers
    SyncPointPerSrc
    QuiescentConverged
