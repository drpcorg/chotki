\* Reachability witness: TLC is asked to "violate" NotConverged, i.e. to
\* find a behaviour in which every replica committed its budget, the
\* network went quiescent and all stores are equal.  The reported
\* "counterexample" is a full happy-path trace of the protocol
\* (handshake -> diff -> V -> live relay) ending in convergence.
\* Expected: NotConverged VIOLATED (this is the desired outcome).
SPECIFICATION Spec
CONSTANTS
    Replicas      <- MCReplicas
    Edges         <- MCEdgesLine
    Objects       <- MCObjects
    CommitBudget  <- MCBudgetAC
    GenBudget     = 1
    PingBudget    = 0
    BuggyRelay    = FALSE
    DisplaceBySrc = TRUE
    DropSyncsOnClose = TRUE
    ProtectLast   = TRUE
    EnableOwnSourceDrain = FALSE
    EnablePing    = FALSE
    BatchMode     = FALSE
    BatchBuggy    = FALSE
INVARIANTS
    NotConverged
