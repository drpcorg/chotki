version: "2"
linters:
  default: none
  enable:
    - asasalint
    - durationcheck
    - exhaustive
    - gocheckcompilerdirectives
    - gochecksumtype
    - gosmopolitan
    - govet
    - ineffassign
    - nilerr
    - reassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks: ["all", "-ST*", "-QF*"]
    govet:
      disable: [inline]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - ineffassign
          - unused
        path: (.+)\.ragel\.go
      - linters:
          - staticcheck
        text: 'SA1019:'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
